name: unit-runtime-smoke

on:
  push:
    branches:
      - claude/blissful-heisenberg-3n2jf3
  workflow_dispatch:

jobs:
  unit-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install             numpy scipy pyyaml psutil filelock tqdm pytest             torch torch_geometric pennylane pennylane-lightning             gemmi openmm parasail
      - name: Critical runtime tests
        env:
          PYTHONPATH: src
        run: |
          pytest -q             tests/test_quantum_architecture.py             tests/test_multiplicity_and_adequacy.py             tests/test_resource_normalized_endpoint.py             tests/test_formal_blockers.py             tests/test_resume_and_isolation_fixes.py
