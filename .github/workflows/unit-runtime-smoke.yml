name: unit-runtime-smoke

on:
  push:
    branches:
      - claude/blissful-heisenberg-3n2jf3
  workflow_dispatch:

jobs:
  unit-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install             numpy scipy pyyaml psutil filelock tqdm pytest ruff             torch torch_geometric pennylane pennylane-lightning             gemmi openmm parasail
      - name: Runtime-error static checks
        run: ruff check src tests --select E9,F63,F7,F82
      - name: Full CPU test suite
        env:
          PYTHONPATH: src
        run: pytest -q tests
