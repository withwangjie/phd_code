<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>XY-QAOA 侧链重建 3D</title>

<!--
  单文件三维演示：纳米抗体界面侧链重建的 XY-QAOA 研究流程（七幕）。
  依赖（均走 CDN，双击即可运行，但需要联网）：
    - Tailwind CSS play CDN（界面布局）
    - Three.js r128 UMD 构建 + examples/js 版 OrbitControls
      选 r128 是因为它是最后一个同时提供 UMD 主包与非模块 OrbitControls 的版本，
      用 file:// 打开时不会遇到 ES 模块的跨域限制。
  数值说明：第五、六幕的基态概率 0.0412 与放大倍数 1.48 为示意值（见页面顶部提示）。
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        fontFamily: {
          ui: ['"Familjen Grotesk"', "system-ui", "-apple-system", '"PingFang SC"', '"Microsoft YaHei"', "sans-serif"],
          mono: ['"JetBrains Mono"', "ui-monospace", "SFMono-Regular", "Menlo", "monospace"]
        }
      }
    }
  };
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<style>
  /* 关键样式内联：即使 Tailwind CDN 加载失败，页面主体也能正常显示 */
  html, body { height: 100%; margin: 0; }
  /* Tailwind 的 .flex 与 [hidden] 优先级相同且排在后面，会让带 hidden 的弹层照样显示；这里强制隐藏 */
  [hidden] { display: none !important; }
  body { background: #ffffff; color: #0f172a; }
  html.dark body { background: #0f172a; color: #e2e8f0; }
  #gl { display: block; width: 100%; height: 100%; touch-action: none; }
  .tabular { font-variant-numeric: tabular-nums; }
  .act-btn[aria-current="true"] .act-n { color: inherit; }
  .notice-pulse { animation: glow 2.4s ease-in-out infinite; }
  @keyframes glow { 0%, 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); } 50% { box-shadow: 0 0 0 3px rgba(245, 158, 11, .18); } }
  .cta-pulse { animation: cta 1.8s ease-in-out infinite; }
  @keyframes cta { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.035); } }
  @media (prefers-reduced-motion: reduce) {
    .notice-pulse, .cta-pulse { animation: none; }
    * { scroll-behavior: auto !important; }
  }
</style>
</head>

<body class="h-full bg-white font-ui text-slate-900 antialiased dark:bg-[#0F172A] dark:text-slate-100">
<div id="app" class="flex h-[100dvh] flex-col">

  <!-- ================= 固定页头：标题 + 主题 + 分享 + 强制提示 ================= -->
  <header class="z-20 shrink-0 border-b border-slate-200 bg-white/95 backdrop-blur dark:border-slate-800 dark:bg-[#0F172A]/95">
    <div class="flex items-center gap-3 px-4 pt-3 pb-2">
      <div class="min-w-0">
        <div class="font-mono text-[10px] uppercase tracking-[0.18em] text-sky-600 dark:text-cyan-300">纳米抗体界面 · 受约束离散优化</div>
        <h1 class="truncate text-lg font-bold tracking-tight sm:text-xl">XY-QAOA 侧链重建</h1>
      </div>
      <div class="ml-auto flex shrink-0 items-center gap-2">
        <button id="theme-btn" type="button"
          class="inline-flex h-9 items-center gap-1.5 rounded-md border border-slate-300 px-3 text-sm font-semibold hover:border-sky-500 hover:text-sky-600 focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-500 dark:border-slate-700 dark:hover:border-cyan-400 dark:hover:text-cyan-300"
          aria-label="切换浅色或深色主题">
          <svg id="theme-icon" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"></svg>
          <span id="theme-label" class="hidden sm:inline">深色</span>
        </button>
        <button id="share-btn" type="button"
          class="inline-flex h-9 items-center gap-1.5 rounded-md bg-sky-600 px-3 text-sm font-semibold text-white hover:bg-sky-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-400 dark:bg-cyan-500 dark:text-slate-950 dark:hover:bg-cyan-400">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
          分享
        </button>
      </div>
    </div>
    <div class="px-4 pb-3" data-notice></div>
  </header>

  <!-- ================= 主体：分幕导航 / 3D 视口 / 解释面板 ================= -->
  <main class="flex min-h-0 flex-1 flex-col lg:flex-row">

    <section id="viewport" class="relative order-1 min-h-[30dvh] flex-[1.15] overflow-hidden lg:order-2 lg:flex-1">
      <canvas id="gl" aria-label="研究流程三维场景"></canvas>
      <div class="pointer-events-none absolute left-3 top-3 flex flex-col gap-1">
        <div id="act-chip" class="w-fit rounded-md border border-slate-200 bg-white/85 px-2.5 py-1 font-mono text-[11px] text-slate-700 backdrop-blur dark:border-slate-700 dark:bg-slate-900/80 dark:text-slate-200"></div>
      </div>
      <div id="hint" class="pointer-events-none absolute bottom-3 left-3 rounded bg-white/80 px-2 py-1 font-mono text-[10px] text-slate-500 backdrop-blur dark:bg-slate-900/70 dark:text-slate-400"></div>
      <div id="gl-error" hidden class="absolute inset-0 flex items-center justify-center p-6">
        <div class="max-w-sm rounded-lg border border-rose-300 bg-rose-50 p-4 text-sm text-rose-900 dark:border-rose-500/40 dark:bg-rose-500/10 dark:text-rose-200">
          <p class="font-semibold">三维场景无法启动</p>
          <p id="gl-error-msg" class="mt-1"></p>
        </div>
      </div>
    </section>

    <nav id="acts" aria-label="七幕切换"
      class="order-2 flex shrink-0 gap-1 overflow-x-auto border-t border-slate-200 bg-slate-50 p-2 dark:border-slate-800 dark:bg-slate-900/60 lg:order-1 lg:w-44 lg:flex-col lg:overflow-x-visible lg:overflow-y-auto lg:border-r lg:border-t-0"></nav>

    <aside id="panel" aria-live="polite"
      class="order-3 min-h-[22dvh] flex-1 overflow-y-auto border-t border-slate-200 bg-white p-5 dark:border-slate-800 dark:bg-[#0F172A] lg:w-[27rem] lg:flex-none lg:border-l lg:border-t-0"></aside>
  </main>
</div>

<!-- ================= 分享模态框 ================= -->
<div id="share-modal" hidden class="fixed inset-0 z-50 flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="share-title">
  <div data-close class="absolute inset-0 bg-slate-950/55 backdrop-blur-sm"></div>
  <div class="relative w-full max-w-md rounded-xl border border-slate-200 bg-white p-6 shadow-2xl dark:border-slate-700 dark:bg-slate-900">
    <div class="flex items-start gap-3">
      <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-sky-100 text-lg dark:bg-cyan-400/15">🔒</div>
      <div class="min-w-0">
        <h2 id="share-title" class="text-base font-bold">分享与访问权限</h2>
        <p class="mt-2 text-sm leading-relaxed text-slate-600 dark:text-slate-300">
          通过 Claude Artifact 发布后，页面默认为<strong class="text-slate-900 dark:text-white">私有状态 🔒</strong>（仅本人可见）。
          若需向导师或组会同事开放查看投屏权限，请在分享菜单中将访问控制切换为：
          <strong class="text-slate-900 dark:text-white">👥 组织内或凭链接可见</strong>。
        </p>
        <p class="mt-3 rounded-md bg-slate-100 px-3 py-2 text-xs leading-relaxed text-slate-600 dark:bg-slate-800 dark:text-slate-400">
          以本地单文件打开时没有访问控制：分享即把这个 HTML 文件本身发给对方。
        </p>
      </div>
    </div>
    <div class="mt-5 flex justify-end">
      <button type="button" data-close
        class="rounded-md border border-slate-300 px-4 py-2 text-sm font-semibold hover:border-sky-500 hover:text-sky-600 focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-500 dark:border-slate-600 dark:hover:border-cyan-400 dark:hover:text-cyan-300">知道了</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* =====================================================================
   * 0. 基础设施：主题、减弱动态、提示框
   * ===================================================================== */
  var root = document.documentElement;
  var motionQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
  var reduced = motionQuery.matches;

  function storedTheme() {
    try { return localStorage.getItem("xyqaoa-theme"); } catch (e) { return null; }
  }
  function saveTheme(t) {
    try { localStorage.setItem("xyqaoa-theme", t); } catch (e) { /* 无痕模式等场景下忽略 */ }
  }
  var theme = storedTheme() || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  root.classList.toggle("dark", theme === "dark");

  // 强制性风险提示（页头、第五幕、第六幕共用同一段文字）
  var NOTICE_TEXT = "💡 提示：第五、六幕的数值（基态概率 0.0412、放大倍数 1.48）为系统收敛终点的逻辑示意值（Mock Data），" +
    "用以说明终点的定义与计算方式，并非最终实验运行结果。正式的大规模生产运行尚未产出最终数据。请在汇报展示时予以保留。";
  function noticeHTML(extra) {
    return '<div class="notice-pulse flex gap-2.5 rounded-md border border-amber-400/70 bg-amber-50 px-3 py-2 ' +
      'text-amber-900 dark:border-amber-400/40 dark:bg-amber-400/10 dark:text-amber-100 ' + (extra || "") + '" role="note">' +
      '<svg class="mt-0.5 h-4 w-4 shrink-0 text-amber-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/>' +
      '<path d="M12 9v4M12 17h.01"/></svg>' +
      '<p class="text-xs leading-relaxed"><span class="mr-1 rounded bg-amber-500 px-1.5 py-px font-mono text-[10px] font-semibold ' +
      'text-white dark:text-slate-950">MOCK DATA</span>' + NOTICE_TEXT + "</p></div>";
  }
  document.querySelector("[data-notice]").innerHTML = noticeHTML();

  var THEME_ICONS = {
    light: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
    dark: '<path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>'
  };
  function refreshThemeButton() {
    document.getElementById("theme-icon").innerHTML = theme === "dark" ? THEME_ICONS.light : THEME_ICONS.dark;
    document.getElementById("theme-label").textContent = theme === "dark" ? "浅色" : "深色";
  }
  refreshThemeButton();

  /* ---------------- 分享模态框 ---------------- */
  var modal = document.getElementById("share-modal");
  var shareBtn = document.getElementById("share-btn");
  function openModal() { modal.hidden = false; modal.querySelector("button[data-close]").focus(); }
  function closeModal() { modal.hidden = true; shareBtn.focus(); }
  shareBtn.addEventListener("click", openModal);
  modal.addEventListener("click", function (e) { if (e.target.closest("[data-close]")) closeModal(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !modal.hidden) closeModal(); });

  /* ---------------- Three.js 是否可用 ---------------- */
  function fail(msg) {
    document.getElementById("gl-error").hidden = false;
    document.getElementById("gl-error-msg").textContent = msg;
  }

  /* =====================================================================
   * 1. 七幕的文字面板
   * ===================================================================== */
  var ACTS = [
    { n: "一", name: "界面", en: "Interface", hint: "悬停 VHH 原子查看接触 · 拖动旋转 · 滚轮缩放" },
    { n: "二", name: "位点", en: "Hotspots", hint: "粒子流示意 EGNN 沿图连边的消息传递" },
    { n: "三", name: "状态", en: "Conformations", hint: "连线连接只差一个位点状态的构型" },
    { n: "四", name: "编码", en: "QUBO Encoding", hint: "每个寄存器恰好一个量子比特发光" },
    { n: "五", name: "演化", en: "QAOA Evolution", hint: "点击面板里的「播放演化」" },
    { n: "六", name: "终点", en: "Convergence", hint: "黄色平面为均匀采样水平 1/729" },
    { n: "七", name: "推断", en: "Inference", hint: "整块分量被剥离，训练永远读不到" }
  ];

  function h2(i) {
    return '<div class="font-mono text-[10px] uppercase tracking-[0.18em] text-sky-600 dark:text-cyan-300">第' + ACTS[i].n + "幕 · " +
      ACTS[i].en + '</div><h2 class="mt-1 text-2xl font-bold tracking-tight">' + ACTS[i].name + "</h2>";
  }
  var P = 'class="mt-3 text-[15px] leading-relaxed text-slate-700 dark:text-slate-300"';
  var MUTED = 'class="mt-3 text-[13px] leading-relaxed text-slate-500 dark:text-slate-400"';
  var BOX = 'class="mt-4 rounded-lg border border-slate-200 bg-slate-50 p-3.5 text-[14px] leading-relaxed dark:border-slate-700 dark:bg-slate-800/50"';
  var BTN = 'class="mt-4 inline-flex items-center gap-2 rounded-md border border-sky-500 px-3.5 py-2 text-sm font-semibold text-sky-700 ' +
    'hover:bg-sky-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-500 dark:border-cyan-400 dark:text-cyan-300 dark:hover:bg-cyan-400/10"';
  function dot(cls) { return '<span class="mr-2 inline-block h-2.5 w-2.5 rounded-full align-middle ' + cls + '"></span>'; }

  function panelHTML(i, stats) {
    switch (i) {
      case 0: return h2(0) +
        "<p " + P + ">复合物取自作者认定的生物组装体。抗原链按 SAbDab 规则判定：任一 CA/CB 落在 VHH 互补决定区（CDR）CA/CB 的 7.5 Å 以内。</p>" +
        '<p class="mt-3 text-[15px] leading-relaxed">' + dot("bg-red-500 shadow-[0_0_8px_#ef4444]") +
        "红色发光原子：跨伙伴<strong>重原子距离 &lt; 5 Å</strong>。这是界面<strong>标签</strong>的定义。</p>" +
        "<div " + BOX + "><strong>图的连边另有规则。</strong>连边与 5 Å 标签相互独立：链内按 Cα 距离 &lt; 8 Å 连边，" +
        "跨伙伴固定取 k = 3 的最近邻（KNN）。这样「两条链之间有没有边」就不会直接泄露界面标签。</div>" +
        '<button id="toggle-contacts" type="button" ' + BTN + '>高亮全部 &lt; 5 Å 接触</button>' +
        "<p " + MUTED + ">本演示模型里有 <span class=\"tabular font-mono\">" + stats.contactResidues + "</span> 个 VHH 残基、" +
        "<span class=\"tabular font-mono\">" + stats.contactPairs + "</span> 对原子落在 5 Å 以内，距离 " + stats.dRange +
        " Å，全部来自 CDR1–3。悬停（手机上轻点）VHH 原子可只看它的接触。</p>";

      case 1: return h2(1) +
        "<p " + P + ">E(n) 等变图神经网络（EGNN）沿图的连边传递信息，给每个残基一个界面概率。场景里的粒子流示意这一消息传递过程。</p>" +
        "<div " + BOX + '><div class="font-mono text-[13px]">score = (1 − w) · EGNN + w · exp(−d<sub>Ag</sub> / 6 Å)</div>' +
        '<div class="mt-1 font-mono text-[12px] text-slate-500 dark:text-slate-400">w = 0.25，d<sub>Ag</sub> 为到抗原的最近距离</div></div>' +
        "<p " + P + ">排名最高的 6 个化学可动残基成为活性位点 " + dot("bg-amber-400 shadow-[0_0_8px_#fbbf24]") +
        "<strong>H1–H6</strong>。6 位点是预注册的主要规模，规模轴另取 4 / 6 / 8 / 10 四档。</p>" +
        "<p " + MUTED + ">对照策略：接触数、最近距离、CDR、随机。骨架断裂处 φ/ψ 无定义的残基不作为候选。</p>";

      case 2: return h2(2) +
        "<p " + P + ">每个活性位点按骨架 φ/ψ 查 Dunbrack 2010 骨架依赖旋转异构体库。规模基准固定为每位点 3 个状态，" +
        "各占一个 χ1 势阱：<span class=\"font-mono\">60° · 180° · 300°</span>。</p>" +
        '<div class="mt-4 rounded-lg bg-sky-50 px-4 py-3 dark:bg-cyan-400/10"><div class="font-mono text-2xl font-semibold text-sky-700 dark:text-cyan-300">' +
        '3<sup>6</sup> = 729</div><div class="mt-0.5 text-sm text-slate-600 dark:text-slate-300">个可行构型</div></div>' +
        "<p " + P + ">球体里每个节点是一个完整构型（6 位点各取一个状态），按 9 × 9 × 9 晶格排布后收成球形。" +
        "连线连接只差一个位点状态的构型，这正是 XY 混合器能直接连通的方向。</p>" +
        "<p " + MUTED + ">自适应模式下每位点 3–6 个状态，全局不超过 30 个变量。粗粒度模型为 χ1 取向，全原子验证用完整 χ1…χN。</p>";

      case 3: return h2(3) +
        "<p " + P + ">每个位点一个一次性（one-hot）寄存器：3 个量子比特里恰好一个为 1。6 个寄存器共 <strong>18 个逻辑量子比特</strong>。</p>" +
        "<div " + BOX + '><div class="font-semibold">QUBO 系数矩阵的颜色</div><ul class="mt-2 space-y-1.5 text-[14px]">' +
        "<li>" + dot("bg-cyan-500") + "对角项：位点内的先验能量</li>" +
        "<li>" + dot("bg-amber-500") + "寄存器之间：位点间的成对相互作用</li>" +
        "<li>" + dot("bg-slate-400") + "寄存器内部非对角：由 one-hot 约束处理，不进入能量</li></ul></div>" +
        "<p " + P + ">约束由后面的 XY 混合器保证，不靠惩罚项。</p>" +
        "<p " + MUTED + ">粗粒度伪原子力场可对 Amber ΔE 做线性校准，系数只用训练复合物拟合，验证与测试阶段冻结。</p>";

      case 4: return h2(4) + '<div class="mt-4">' + noticeHTML() + "</div>" +
        "<p " + P + ">初态是每个寄存器内的等幅 W 态，本身就在可行子空间里。XY 混合器只在寄存器内部搬运那一个激发，" +
        "演化全程不离开可行空间。代价层与混合层交替作用后，概率向低能构型集中。</p>" +
        '<div class="mt-4 grid grid-cols-2 gap-px overflow-hidden rounded-lg border border-slate-200 bg-slate-200 dark:border-slate-700 dark:bg-slate-700">' +
        readout("当前层", "ro-layer", "初态 · W 态") + readout("可行构型", "ro-n", "729") +
        readout("基态概率", "ro-p", "0.00137") + readout("log10 放大倍数", "ro-amp", "0.00") + "</div>" +
        '<div class="mt-4 flex flex-wrap items-center gap-3">' +
        '<button id="play-evo" type="button" class="cta-pulse inline-flex items-center gap-2 rounded-md bg-sky-600 px-4 py-2 text-sm font-semibold text-white ' +
        'hover:bg-sky-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-400 dark:bg-cyan-500 dark:text-slate-950 dark:hover:bg-cyan-400">' +
        '<svg class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg><span>播放演化</span></button>' +
        '<label class="flex min-w-[10rem] flex-1 items-center gap-2 text-xs text-slate-500 dark:text-slate-400" for="evo-range">进度' +
        '<input id="evo-range" type="range" min="0" max="1000" value="0" class="w-full accent-sky-600 dark:accent-cyan-400"></label></div>' +
        "<p " + MUTED + ">主要深度 p = 2（两轮代价层 + 混合层）；有限 shot 目标函数用 CVaR α = 0.1。探索性分析扫 p ∈ {1, 2, 3, 4, 6}，" +
        "每个参数 20 次评估，把深度和优化预算分开。27 × 27 根柱对应 729 个可行构型，高度为测到该构型的概率。</p>";

  var groundGlow = glow(barsExtra, new THREE.Vector3(cellX(GROUND), H_BASE + H_SCALE, cellZ(GROUND)), 14, { group: "barsExtra", color: "ground", opacity: 0.9 });
  var H_UNI = H_BASE + (1 / NODE_N) / P_FINAL * H_SCALE;
  var uniMat = makeMat("basic", { group: "barsExtra", color: "amber", opacity: 0.22, side: THREE.DoubleSide, depthWrite: false });
  var uniPlane = new THREE.Mesh(new THREE.PlaneGeometry(GRID * SP + 1.5, GRID * SP + 1.5), uniMat);
  uniPlane.rotation.x = -Math.PI / 2; uniPlane.position.y = H_UNI + 0.02; barsExtra.add(uniPlane);
  var lblUni = makeLabel("均匀采样 1/729 = 0.00137", { group: "barsExtra", size: 1.5, css: "amber" });
  lblUni.position.set(-(GRID * SP) / 2 + 5, H_UNI + 1.6, (GRID * SP) / 2); barsExtra.add(lblUni);
  var lblGround = makeLabel("基态 p = 0.0412 · 放大 1.48（示意）", { group: "barsExtra", size: 1.7, css: "ground" });
  lblGround.position.set(cellX(GROUND), H_BASE + H_SCALE + 3.2, cellZ(GROUND)); barsExtra.add(lblGround);

  var evo = { u: 0, playing: false, t0: 0, dur: 7000, step: 0 };
  var LAYER_NAMES = ["代价层 1", "混合层 1", "代价层 2", "混合层 2"];
  function setEvolution(u) {
    evo.u = clamp01(u);
    distribution(evo.u);
    drawBars();
    var pg = PROB[GROUND];
    var el = function (id) { return document.getElementById(id); };
    if (el("ro-p")) {
      el("ro-layer").textContent = evo.u <= 0 ? "初态 · W 态" : evo.u >= 1 ? "终点（p = 2）" : LAYER_NAMES[Math.min(3, Math.floor(evo.u * 4))];
      el("ro-p").textContent = pg.toFixed(4);
      el("ro-amp").textContent = (Math.log(pg * NODE_N) / Math.LN10).toFixed(2);
      el("evo-range").value = Math.round(evo.u * 1000);
    }
  }
  setEvolution(0);

  /* ---------- 组「infer」：分层门控的两族假设 + 40 格留出集（第七幕） ---------- */
  var inferGroup = new THREE.Group(); scene.add(inferGroup);
  function slab(x, y, z, w, tier, text) {
    var mats = [];
    for (var l = 0; l < 3; l++) {
      var m = makeMat("std", { group: "infer", color: tier === 1 ? "slab" : "slab2", emissive: tier === 1 ? "slab" : "slab2", emissiveI: tier === 1 ? 0.35 : 0.08, opacity: tier === 1 ? 0.8 - l * 0.15 : 0.5 - l * 0.1 });
      var box = new THREE.Mesh(new THREE.BoxGeometry(w, 0.38, 4.2), m);
      box.position.set(x, y + l * 0.72, z); inferGroup.add(box); mats.push(m);
    }
    var lb = makeLabel(text, { group: "infer", size: 1.35, css: tier === 1 ? "slab" : "muted" });
    lb.position.set(x, y + 3.1, z); inferGroup.add(lb);
    return mats;
  }
  var TZ = -16;
  slab(-25, 13, TZ, 8.5, 1, "H₁ 基态放大倍数");
  slab(-15, 13, TZ, 8.5, 1, "H₂ 规模斜率");
  var gateMat = makeMat("std", { group: "infer", color: "amber", emissive: "amber", emissiveI: 0.6 });
  var gate = new THREE.Mesh(new THREE.TorusGeometry(3.2, 0.22, 10, 48), gateMat);
  gate.position.set(-20, 9.2, TZ); gate.rotation.x = Math.PI / 2; inferGroup.add(gate);
  var lblGate = makeLabel("门控：两个主要假设都拒绝后放行", { group: "infer", size: 1.35, css: "amber" });
  lblGate.position.set(-6.5, 9.6, TZ); inferGroup.add(lblGate);
  [["QTS99", -29], ["QTS99 · 仅执行", -22.3], ["best-of-N", -15.7], ["CVaR 对均值", -9]].forEach(function (s) { slab(s[1], 3, TZ, 5.8, 2, s[0]); });
  var lblPrim = makeLabel("主要族 · 全 α · Holm", { group: "infer", size: 1.7, css: "slab" });
  lblPrim.position.set(-20, 19.5, TZ); inferGroup.add(lblPrim);
  var lblSec = makeLabel("次要族 · 门控调整", { group: "infer", size: 1.7, css: "muted" });
  lblSec.position.set(-19, 0.2, TZ + 3.5); inferGroup.add(lblSec);

  // 40 个复合物排成 8×5；同一字母为一个连通分量（整块），E/J/M 三块被留出
  var LAYOUT = ["AABBBCDD", "AEEBFCDG", "HEIIFFJG", "HKILLJJG", "MKKLNNJO"];
  var HELD = { E: 1, J: 1, M: 1 };
  var TILE = 3.3, TX0 = 2, TZ0 = -4;
  var comps = {}, tiles = [], compOrder = [];
  for (var tr = 0; tr < 5; tr++) for (var tc = 0; tc < 8; tc++) {
    var id = LAYOUT[tr][tc];
    if (!comps[id]) { comps[id] = { id: id, tiles: [], held: !!HELD[id], group: new THREE.Group(), center: new THREE.Vector3() }; compOrder.push(id); inferGroup.add(comps[id].group); }
  }
  compOrder.forEach(function (id, n) { comps[id].tint = n % 2 ? "tileA" : "tileB"; });
  for (tr = 0; tr < 5; tr++) for (tc = 0; tc < 8; tc++) {
    var cid = LAYOUT[tr][tc], comp = comps[cid];
    // 与相邻格属于不同分量的一侧留缝，分量因此显示为连续的整块
    var gapL = tc === 0 || LAYOUT[tr][tc - 1] !== cid ? 0.28 : 0;
    var gapR = tc === 7 || LAYOUT[tr][tc + 1] !== cid ? 0.28 : 0;
    var gapT = tr === 0 || LAYOUT[tr - 1][tc] !== cid ? 0.28 : 0;
    var gapB = tr === 4 || LAYOUT[tr + 1][tc] !== cid ? 0.28 : 0;
    var w = TILE - gapL - gapR, dz = TILE - gapT - gapB;
    var cx = TX0 + tc * TILE + (gapL - gapR) / 2, cz = TZ0 + tr * TILE + (gapT - gapB) / 2;
    var tm = makeMat("std", { group: "infer", color: comp.tint, emissive: "ground", emissiveI: 0, opacity: 0.85 });
    var tile = new THREE.Mesh(new THREE.BoxGeometry(w, 0.5, dz), tm);
    tile.position.set(cx, 0, cz);
    comp.group.add(tile);
    comp.center.add(new THREE.Vector3(cx, 0, cz));
    var tileRec = { comp: comp, mat: tm, x: cx, scanned: false };
    comp.tiles.push(tileRec); tiles.push(tileRec);
  }
  compOrder.forEach(function (id) {
    var comp = comps[id];
    comp.center.divideScalar(comp.tiles.length);
    // 分量组以自身中心为原点，便于整块抬起并旋转
    comp.group.position.copy(comp.center);
    comp.group.children.forEach(function (m) { m.position.sub(comp.center); });
    if (comp.held) {
      var km = makeMat("std", { group: "infer", color: "ground", emissive: "ground", emissiveI: 0.45, opacity: 0 });
      var knot = new THREE.Mesh(new THREE.TorusKnotGeometry(1.25, 0.36, 90, 12), km);
      knot.position.set(0, 4.2, 0); comp.group.add(knot);
      comp.knot = knot; comp.knotMat = km;
    }
  });
  var laserMat = makeMat("basic", { group: "infer", color: "laser", opacity: 0, side: THREE.DoubleSide, depthWrite: false });
  var laser = new THREE.Mesh(new THREE.PlaneGeometry(0.35, 5 * TILE + 3), laserMat);
  laser.rotation.x = -Math.PI / 2; laser.position.set(TX0 - 2, 0.6, TZ0 + 2 * TILE); inferGroup.add(laser);
  var laserGlow = glow(inferGroup, new THREE.Vector3(TX0 - 2, 1, TZ0 + 2 * TILE), 9, { group: "infer", color: "laser", opacity: 0 });
  var lblTrain = makeLabel("训练 + 内部验证", { group: "infer", size: 1.3, css: "muted" });
  lblTrain.position.set(TX0 + 3.5 * TILE, 3.5, TZ0 + 5 * TILE + 1.5); inferGroup.add(lblTrain);
  var lblHeld = makeLabel("留出 · 整块分量（示意）", { group: "infer", size: 1.45, css: "ground" });
  lblHeld.position.set(TX0 + 3.5 * TILE, 13.5, TZ0 + 2 * TILE); inferGroup.add(lblHeld);
  var scan = { t0: 0, phase: "idle" };
  function startScan(now) {
    scan.t0 = now; scan.phase = reduced ? "done" : "scan";
    tiles.forEach(function (t) { t.scanned = reduced && t.comp.held; look(t.mat, { color: t.scanned ? "ground" : t.comp.tint, emissiveI: t.scanned ? 0.55 : 0 }); });
    compOrder.forEach(function (id) {
      var c = comps[id];
      c.lift = reduced && c.held ? 1 : 0;
      if (c.knotMat) look(c.knotMat, { opacity: reduced ? 0.95 : 0 });
    });
    look(lblHeld.material, { opacity: reduced ? 1 : 0 });
  }
  function updateInfer(now, dt) {
    var span = 8 * TILE + 4;
    if (scan.phase === "scan") {
      var s = clamp01((now - scan.t0) / 3000);
      var lx = TX0 - 2 + s * span;
      laser.position.x = lx; laserGlow.position.x = lx;
      look(laserMat, { opacity: 0.85 }); look(laserGlow.material, { opacity: 0.8 });
      tiles.forEach(function (t) {
        if (!t.scanned && t.comp.held && t.comp.group.position.x + t.x - t.comp.center.x <= lx) {
          t.scanned = true;
          look(t.mat, { color: "ground", emissiveI: 0.55 });
        }
      });
      if (s >= 1) { scan.phase = "lift"; scan.t0 = now; look(laserMat, { opacity: 0 }); look(laserGlow.material, { opacity: 0 }); }
    } else if (scan.phase === "lift") {
      var l = easeInOut(clamp01((now - scan.t0) / 1300));
      compOrder.forEach(function (id) { if (comps[id].held) comps[id].lift = l; });
      if (l >= 1) scan.phase = "done";
      look(lblHeld.material, { opacity: l });
      compOrder.forEach(function (id) { if (comps[id].knotMat) look(comps[id].knotMat, { opacity: l > 0.5 ? 0.95 : 0 }); });
    }
    compOrder.forEach(function (id) {
      var c = comps[id];
      c.group.position.y = (c.lift || 0) * 8;
      if (c.held && c.lift > 0 && !reduced) c.group.rotation.y += dt * 0.6;
      if (c.knot && !reduced) { c.knot.rotation.x += dt * 0.9; c.knot.rotation.z += dt * 0.5; }
    });
  }

  /* =====================================================================
   * 5. 分幕调度：组淡入淡出、按幕改外观、相机飞行
   * ===================================================================== */
  var SCENES = [
    { groups: ["mol", "contacts"], cam: [-6, 16, 60], tgt: [-3, 0, 0], rotate: true },
    { groups: ["mol", "contacts", "flow", "hot"], cam: [6, 20, 50], tgt: [-2, 0, 0], rotate: true },
    { groups: ["mol", "hot", "conf"], cam: [4, 22, 92], tgt: [0, 17, 0], rotate: true },
    { groups: ["qubo"], cam: [-2, 20, 64], tgt: [-3, 4, 0], rotate: false },
    { groups: ["bars"], cam: [30, 30, 44], tgt: [0, 5, 0], rotate: false },
    { groups: ["bars", "barsExtra"], cam: [cellX(GROUND) + 20, 26, cellZ(GROUND) + 26], tgt: [cellX(GROUND), 9, cellZ(GROUND)], rotate: false },
    { groups: ["infer"], cam: [2, 28, 80], tgt: [-1, 5, -3], rotate: true }
  ];
  var MOL_LOOKS = [
    { vhh: ["vhh", 1], ag: ["antigen", 0.6], cloud: ["cloud", 0.16], stick: ["vhh", 0.85] },
    { vhh: ["vhh", 0.3], ag: ["antigen", 0.22], cloud: ["cloud", 0.07], stick: ["vhh", 0.25] },
    { vhh: ["dim", 0.4], ag: ["dim", 0.16], cloud: ["dim", 0.05], stick: ["dim", 0.3] }
  ];
  var current = -1;
  var camFrom = new THREE.Vector3(), camTo = new THREE.Vector3(), tgtFrom = new THREE.Vector3(), tgtTo = new THREE.Vector3();
  var camT0 = -1, CAM_DUR = 1400, userInteracting = false;

  function goTo(i) {
    if (i === current) return;
    var prev = current;
    current = i;
    var sc = SCENES[i];
    Object.keys(groupAlphaT).forEach(function (g) { groupAlphaT[g] = sc.groups.indexOf(g) >= 0 ? 1 : 0; });
    if (i === 1) groupAlphaT.contacts = 0.45;
    if (MOL_LOOKS[i]) {
      var L = MOL_LOOKS[i];
      ["vhh", "ag", "cloud", "stick"].forEach(function (key) { molMats[key].forEach(function (m) { look(m, { color: L[key][0], opacity: L[key][1] }); }); });
    }
    // 进入各幕时的状态
    showAllContacts = i === 0 ? showAllContacts : false; hoverResidue = -1; refreshContacts();
    if (i === 2) confT0 = performance.now();
    if (i === 3) paintRegisters();
    if (i === 4) { evo.playing = false; evo.step = 0; if (prev !== 5) setEvolution(0); }
    if (i === 5) { evo.playing = false; setEvolution(1); }
    groundWidthT = i === 5 ? 1.7 : 1;
    if (i === 6) startScan(performance.now());
    // 相机
    camFrom.copy(camera.position); tgtFrom.copy(controls.target);
    camTo.set(sc.cam[0], sc.cam[1], sc.cam[2]); tgtTo.set(sc.tgt[0], sc.tgt[1], sc.tgt[2]);
    if (reduced) { camera.position.copy(camTo); controls.target.copy(tgtTo); camT0 = -1; }
    else camT0 = performance.now();
    userInteracting = false;
    controls.autoRotate = !reduced && sc.rotate;
    // 界面文字
    renderPanel(i);
    document.getElementById("act-chip").textContent = "第" + ACTS[i].n + "幕 · " + ACTS[i].name + " " + ACTS[i].en;
    document.getElementById("hint").textContent = ACTS[i].hint;
    var btns = nav.querySelectorAll("button");
    for (var k = 0; k < btns.length; k++) btns[k].setAttribute("aria-current", k === i ? "true" : "false");
    if (btns[i].scrollIntoView) btns[i].scrollIntoView({ block: "nearest", inline: "nearest", behavior: reduced ? "auto" : "smooth" });
    canvas.style.cursor = "";
  }

  function renderPanel(i) {
    var panel = document.getElementById("panel");
    panel.innerHTML = panelHTML(i, STATS);
    panel.scrollTop = 0;
    if (i === 0) {
      var tb = document.getElementById("toggle-contacts");
      tb.textContent = showAllContacts ? "只看悬停的残基" : "高亮全部 < 5 Å 接触";
      tb.addEventListener("click", function () {
        showAllContacts = !showAllContacts;
        tb.textContent = showAllContacts ? "只看悬停的残基" : "高亮全部 < 5 Å 接触";
        refreshContacts();
      });
    }
    if (i === 4) {
      var pb = document.getElementById("play-evo"), rng = document.getElementById("evo-range");
      if (reduced) pb.querySelector("span").textContent = "下一层";
      pb.addEventListener("click", function () {
        pb.classList.remove("cta-pulse");
        if (reduced) {
          // 减弱动态：每次点击推进一层（共四层：两轮代价层 + 混合层）
          evo.step = evo.step >= 4 ? 0 : evo.step + 1;
          setEvolution(evo.step / 4);
          pb.querySelector("span").textContent = evo.step >= 4 ? "从头开始" : "下一层";
        } else {
          evo.playing = true; evo.t0 = performance.now() - evo.u * evo.dur;
          if (evo.u >= 1) evo.t0 = performance.now();
        }
      });
      rng.addEventListener("input", function () { evo.playing = false; setEvolution(rng.value / 1000); });
      setEvolution(evo.u);
    }
    if (i === 6) document.getElementById("rescan").addEventListener("click", function () { startScan(performance.now()); });
  }

  /* 射线检测：第一幕悬停（触屏上为轻点）VHH 原子 */
  var raycaster = new THREE.Raycaster(), pointer = new THREE.Vector2();
  function pick(ev) {
    if (current !== 0) return;
    var rect = canvas.getBoundingClientRect();
    pointer.x = ((ev.clientX - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((ev.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    var hit = raycaster.intersectObjects(residueMeshes, false)[0];
    var r = hit ? hit.object.userData.residue : -1;
    canvas.style.cursor = r >= 0 ? "pointer" : "";
    if (r !== hoverResidue) { hoverResidue = r; refreshContacts(); }
  }
  canvas.addEventListener("pointermove", function (e) { if (e.pointerType === "mouse") pick(e); });
  canvas.addEventListener("pointerdown", function (e) { if (e.pointerType !== "mouse") pick(e); });
  canvas.addEventListener("pointerleave", function () { if (current === 0 && hoverResidue !== -1) { hoverResidue = -1; refreshContacts(); } });
  controls.addEventListener("start", function () { userInteracting = true; controls.autoRotate = false; camT0 = -1; });

  /* 键盘左右键切换 */
  document.addEventListener("keydown", function (e) {
    if (!modal.hidden) return;
    var tag = (e.target && e.target.tagName) || "";
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    if (e.key === "ArrowRight") goTo(Math.min(ACTS.length - 1, current + 1));
    if (e.key === "ArrowLeft") goTo(Math.max(0, current - 1));
  });

  /* 主题切换 */
  function applyTheme(t) {
    theme = t; pal = PALETTES[t];
    root.classList.toggle("dark", t === "dark");
    saveTheme(t);
    scene.background.setHex(pal.bg);
    scene.fog.color.setHex(pal.fog);
    buildGrid();
    labels.forEach(function (l) { l.draw(); });
    refreshThemeButton();
  }
  document.getElementById("theme-btn").addEventListener("click", function () { applyTheme(theme === "dark" ? "light" : "dark"); });

  /* 减弱动态设置在运行中改变时同步 */
  function onMotionChange(e) {
    reduced = e.matches;
    controls.autoRotate = !reduced && SCENES[current].rotate && !userInteracting;
    renderPanel(current);
    if (current === 2) confT0 = performance.now();
    if (current === 6) startScan(performance.now());
  }
  if (motionQuery.addEventListener) motionQuery.addEventListener("change", onMotionChange);
  else if (motionQuery.addListener) motionQuery.addListener(onMotionChange);

  /* =====================================================================
   * 6. 渲染循环
   * ===================================================================== */
  var last = performance.now();
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    var t = now / 1000;
    if (camT0 >= 0) {
      var s = easeInOut(clamp01((now - camT0) / CAM_DUR));
      camera.position.lerpVectors(camFrom, camTo, s);
      controls.target.lerpVectors(tgtFrom, tgtTo, s);
      if (s >= 1) camT0 = -1;
    }
    if (groupAlpha.flow > 0.01) updateFlow(dt);
    if (groupAlpha.conf > 0.01) updateConf(now);
    if (groupAlpha.qubo > 0.01) updateQubo(dt);
    if (groupAlpha.infer > 0.01) updateInfer(now, dt);
    if (evo.playing) {
      var u = (now - evo.t0) / evo.dur;
      setEvolution(u);
      if (u >= 1) evo.playing = false;
    }
    groundWidth += (groundWidthT - groundWidth) * (reduced ? 1 : 1 - Math.exp(-dt * 5));
    if (groupAlpha.bars > 0.01 && Math.abs(groundWidth - groundWidthT) > 1e-3) drawBars();
    if (!reduced) {
      hotViz.forEach(function (h, k) { h.glow.scale.setScalar(8.5 + Math.sin(t * 2.4 + k) * 1.1); });
      groundGlow.scale.setScalar(14 + Math.sin(t * 2) * 2);
      gate.rotation.z += dt * 0.8;
    }
    updateManaged(dt, t);
    controls.update();
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  glReady = true;
  goTo(0);
  // 首帧直接落到第一幕的目标机位，避免开场飞行
  camera.position.copy(camTo); controls.target.copy(tgtTo); camT0 = -1;
  requestAnimationFrame(frame);

  /* 降级模式：三维场景不可用时只切换文字面板（交互按钮无效，文字完整） */
  function showPanelOnly(i) {
    var stats = { contactResidues: 7, contactPairs: 17, dRange: "4.3–4.9" };
    document.getElementById("panel").innerHTML = panelHTML(i, stats);
    document.getElementById("act-chip").textContent = "第" + ACTS[i].n + "幕 · " + ACTS[i].name + " " + ACTS[i].en;
    var btns = nav.querySelectorAll("button");
    for (var k = 0; k < btns.length; k++) btns[k].setAttribute("aria-current", k === i ? "true" : "false");
  }
})();
</script>
</body>
