# full_experiment_config.yaml
#
# Single configuration file for run_full_experiment.py / run_full_experiment.sh.
# Every parameter that governs a scientific decision (queue sizes, budgets,
# thresholds, pruning strategies) lives here, not hardcoded in the
# orchestrator, so the whole protocol is frozen and auditable by reading one
# file. Frozen BEFORE a formal run starts, per the project's own rule that
# parameters/endpoints/queues/repeat-counts must not change after looking at
# results: copy this file alongside every run's own output directory the
# first time you launch (run_full_experiment.py does this automatically into
# <run_dir>/frozen_config.yaml) and treat that frozen copy, not this source
# file, as the record of what a given run actually used.

# ---------------------------------------------------------------------------
# Identity / reproducibility
# ---------------------------------------------------------------------------
master_seed: 4050350448  # Independently drawn before the run; frozen for reproducibility
                        # streams via seed_streams.py -- never used bare anywhere.

# ---------------------------------------------------------------------------
# Paths (all relative to the repository root unless absolute)
# ---------------------------------------------------------------------------
paths:
  repo_root: "."
  data_root: "/data/quantum-protein/data"  # fallback only; resolve_server_config.py overrides from server_config/QP_DATA_ROOT
  # Directory NAMES (not paths), resolved under THIS run's own run_dir
  # (run_dir/dataset_dir, run_dir/checkpoint_dir) -- never a fixed,
  # repo-root-level path shared across runs. This is what makes every run's
  # dataset/checkpoints/qc_benchmark/structure artifacts fully isolated:
  # two runs launched from the same repo never overwrite or silently read
  # each other's dataset_clean_full/checkpoints_full (requirement #4). The
  # historical capped dataset_clean_500/checkpoints_500 directories are
  # never touched by this orchestrator regardless of this setting.
  dataset_dir: "dataset"
  checkpoint_dir: "checkpoints"
  # Root under which every run gets its own unique, timestamped directory
  # (run_full_experiment.py creates experiments_full_run_<UTC timestamp>/
  # under this root; it never reuses or overwrites an existing one).
  run_root: "/data/quantum-protein/runs"  # fallback only; runtime resolver selects server-specific run_root
  run_prefix: "experiments_full_run_"

# ---------------------------------------------------------------------------
# Stage toggles control whether a stage is eligible to run. Disabled stages
# are recorded as skipped, but skipped does NOT generally satisfy downstream
# prerequisites. Only smoke_check is explicitly optional; scientific stages
# fail closed when a required prerequisite is disabled/incomplete. Use
# --resume/--only only with already completed, artifact-verified prerequisites.
# ---------------------------------------------------------------------------
stages:
  env_check: true
  smoke_check: true
  data_audit: true
  queue_freeze: true          # dataset split (no-cap) + validation-queue selection
  graph_build: true           # produced as part of queue_freeze (build_final_pyg_dataset.py)
  egnn_train: true
  energy_calibration: true    # train-only coarse component -> Amber14 calibration
  method_sensitivity: true     # development-only QAOA hyperparameter robustness
  qc_benchmark: true          # --research-ablation: pruning x budget x objective sweep
  structure_experiment: true  # dev queue + validation queue recovery-benchmark
  external_validation: true    # external VHH graphs + FASPR/Phenix structural baselines
  statistics: true            # --paired-statistics
  final_report: true

# ---------------------------------------------------------------------------
# Stage 0: required dependency imports; fail closed when unavailable.
# No installation or trial experiment is performed.
# Dependency failures stop dependent stages.
# ---------------------------------------------------------------------------
env_check:
  required_python_packages:
    - numpy
    - scipy
    - torch
    - torch_geometric
    - gemmi
    - pennylane
    - filelock
    - openmm
    - pdbfixer
    - parasail
    - psutil
    - tqdm
    - yaml  # PyYAML, required by run_full_experiment.py itself

# ---------------------------------------------------------------------------
# Stage: smoke check. A tiny, fast, self-contained pass through each stage's
# CLI (--max-targets 1 / --targets 1 / --dry-run style flags) BEFORE the real
# run, so a broken environment or code change is caught in seconds/minutes,
# not hours into a real run. Kept fully separate from the real run's output
# directory and never mixed into its results (per "检查结果与正式实验分开保存").
# ---------------------------------------------------------------------------
smoke_check:
  ablation_max_targets: 1
  recovery_pilot_targets: 1
  recovery_pilot_pdb_id: "4s10"  # explicit smoke target; never inferred from targets/eval_shots
  recovery_pilot_sites: 5
  recovery_pilot_seeds: [42]
  recovery_pilot_max_evals: 12
  recovery_pilot_outputs: 20

# ---------------------------------------------------------------------------
# Stage 1: data audit (audit_all_datasets.py). Unchanged upstream script;
# orchestrator only supplies --workers/--limit and checks the four output
# files (data_audit_report.md/_details.csv/_details.jsonl/_inventory.json)
# exist and are non-empty before marking the stage complete.
# ---------------------------------------------------------------------------
data_audit:
  workers: 16  # runtime fallback; auto-resolved from server CPU resources before formal launch
  limit: 0  # 0 = no limit; audits every discovered structure
  # High-confidence structure benchmark gates.
  max_resolution_angstrom: 3.0
  min_interface_occupancy: 0.90
  allow_interface_altloc: false
  allow_unknown_resolution: false
  allow_incomplete_interface_sidechains: false

# ---------------------------------------------------------------------------
# Stage 2: queue freeze + isolation (no cap) + graph construction.
# 2a. build_final_pyg_dataset.py --no-cap: initial CDR-H3 representative
#     selection is followed by final graph-level VHH/CDR-H3/antigen sequence
#     isolation plus required family/structure cluster isolation. The same
#     frozen cluster map is reused for downstream statistics. The stage DOES
#     NOT cap the
#     resulting test_snac_hard split at any fixed count -- every qualifying,
#     independent cluster is kept (requirement #1: cancel the 500 cap).
# 2b. run_real_complex_pilot.py --prepare-only: freezes a NEW, blind,
#     validation-only target queue, explicitly excluding every historical
#     development target (dev_queue.excluded_pdb below) and using a
#     seeded-random (not "smallest structure first") selection order, so it
#     cannot inherit the ascending-residue-count bias the 0918 status report
#     flagged in the original 4S10/8YVO/9GCN pilot. Produces
#     eligibility.json + selected_targets.json + one recovery_manifest.json
#     per selected target, BEFORE any solver is run against them --
#     "freezing" means exactly this: nothing past this point may change
#     which targets were selected or why.
# ---------------------------------------------------------------------------
queue_freeze:
  # External family/domain/structure clustering. The JSON maps lower/upper-case
  # PDB IDs to a cluster identifier (e.g. Foldseek antigen/domain cluster).
  independence_clustering:
    required: true
    cluster_map: "data/independence/pdb_family_clusters.json"
    pair_tsv: "data/independence/foldseek_pairs.tsv"
    # Pair TSV must start with: query<TAB>target<TAB>qtmscore.
    # Foldseek's default third column is fident and is rejected. Generate scores
    # with --format-output query,target,qtmscore, then prepend that header.
    # qtmscore is normalized by query protein length; direction matters.
    # TM-score 0.50 has published fold/topology significance [METHODS_EVIDENCE R27].
    min_score: 0.50
    score_semantics: "qtmscore"
    query_column: 0
    target_column: 1
    score_column: 2
  # Homology-isolation protocol. Any criterion that fires joins two complexes
  # into the same connected component; a component may never cross a split.
  homology_isolation:
    # Literature-supported anti-leakage precedents:
    # VHH/antibody non-redundancy at 0.80 [R24]; CDR-H3 clustering at 0.50 [R23];
    # protein train/test filtering at 0.30 identity with 0.70 coverage [R25].
    # Region of each identity: VHH and antigen are FULL-CHAIN global NW
    # identities; cdr_h3_identity is computed on the CDR-H3 LOOP sequence only.
    # Measured values in outputs carry the region in their names
    # (*_vhh_full_chain_identity, *_cdr_h3_loop_identity,
    # *_antigen_full_chain_identity). Key names here are kept for checkpoint
    # and frozen-config compatibility.
    vhh_full_chain_identity: 0.80   # full VHH chain
    cdr_h3_identity: 0.50           # CDR-H3 loop only
    antigen_identity: 0.30          # full antigen chain(s)
    antigen_min_length_coverage: 0.70
  graph_build:
    workers: 8  # runtime fallback; auto-resolved from server CPU resources
    # Scientific graph protocol. Changing any value requires a fresh dataset;
    # graph v1.8 records these values in every .pt and run_summary.json.
    # 5 A cross-partner atom contact is literature-supported for antibody-antigen/CAPRI-style interfaces [METHODS_EVIDENCE R3,R4].
    interface_label_cutoff_angstrom: 5.0
    # 8 A C-alpha residue-graph construction has direct protein-GNN precedent [R22].
    intra_chain_ca_cutoff_angstrom: 8.0
    # k=3 remains a study-specific leakage-control choice; no claim of literature-optimality.
    cross_partner_knn_k: 3
    min_interface_residues: 15
    # build_final_pyg_dataset.py --no-cap ignores target_hard's 300..500
    # range check entirely; this value is recorded for provenance only and
    # has no selection effect when no_cap is true.
    no_cap: true
    target_hard_if_capped: 500

  dev_queue:
    # Historical engineering-pilot targets. Permanently barred from ever
    # re-entering the validation queue below, regardless of future reruns.
    excluded_pdb: ["4s10", "8yvo", "9gcn"]
    role_label: "dev"
    # Formal structural-experiment protocol for the dev/regression queue,
    # explicit rather than left to a hardcoded default (requirement #3);
    # same "egnn" main-protocol rule as validation_queue.pruning below.
    pruning: "egnn"

  validation_queue:
    role_label: "validation"
    # 0 = no hidden cap: every qualifying, independent, all-atom-ready
    # target is processed (requirement #3). A positive number freezes an
    # EXPLICIT subset and must be decided before the run starts, never
    # adjusted after inspecting results; run_real_complex_pilot.py's own
    # report and run_summary.json state the actual coverage (selected /
    # examined qualifying pool), so a capped run is never silently reported
    # as if every qualifying target ran.
    target_count: 0
    sites: 6
    selection_order: "seeded_random"  # never "ascending_size" for this queue
    # The REAL, final validation protocol: formal validation uses the
    # trained EGNN main pipeline, not contact/distance/cdr/random (those are
    # matched-budget ABLATION baselines only, swept explicitly in
    # qc_benchmark.pruning -- never silently substituted for the main
    # validation strategy here).
    pruning: "egnn"
    # Backward-compatible CLI provenance only. Queue freezing now uses
    # --eligibility-only: NO temporary pruning/ranking selects residues.
    # Membership requires sequence/family isolation plus >=sites independently
    # Dunbrack/Amber-compatible movable VHH residues. Formal EGNN ranking occurs
    # only after egnn_train on the already-frozen PDB allowlist.
    eligibility_bootstrap_pruning: "contact"

# ---------------------------------------------------------------------------
# Stage 3: EGNN training (train_egnn_pruning.py). Runs against the uncapped
# dataset's train split. Internal train/validation partitioning uses layered
# VHH/CDR-H3/antigen connected components from queue_freeze.homology_isolation
# with deterministic 5-fold hashing (validation fold 0), never random 90/10. checkpoint_dir matches queue_freeze.validation_queue
# .checkpoint's directory above so the freshly trained weights are what the
# validation-queue EGNN pruning selection actually uses.
# ---------------------------------------------------------------------------
egnn_train:
  nproc_per_node: 2  # runtime fallback; resolver derives DDP ranks from available GPUs while preserving target global batch
  max_epochs: 50
  patience: 5
  batch_size: 2  # runtime fallback; resolver recomputes per-rank batch from target global batch
  hidden_dim: 32
  num_layers: 4
  dropout: 0.10
  coord_scale: 0.10
  geometry_baseline_contact_cutoff_angstrom: 8.0
  geometry_baseline_proximity_scale_angstrom: 6.0
  learning_rate: 1.0e-3
  weight_decay: 1.0e-5
  gradient_clip: 5.0
  amp: true
  pin_memory: true
  # Uses queue_freeze.homology_isolation exactly; no independent threshold.
  device: "cuda"
  threads: 4      # runtime fallback; auto-resolved
  num_workers: 8  # runtime fallback; auto-resolved

# ---------------------------------------------------------------------------
# Frozen quantum protocol (single source of truth for every formal QAOA run).
# QAOA follows Farhi et al. [R7]; feasibility-preserving alternating-operator
# mixers follow Hadfield et al. [R28]; finite-shot CVaR follows [R8].
# Exact numerical budgets remain preregistered study choices, not literature
# optima. Validation/test results must never be used to retune this block.
# ---------------------------------------------------------------------------
quantum_protocol:
  algorithm: "xy_qaoa"
  encoding: "one_hot_rotamer_registers"
  mixer: "local_xy"
  initial_state: "wstate"  # product of local one-hot W states; matches solver implementation [R30]
  simulation_scope: "exact_feasible_subspace_classical_simulation"

  primary:
    depth: 2
    max_evals: 90
    objective: "cvar"
    restarts: 4
    cvar_alpha: 0.10
    eval_shots: 500
    output_shots: 1000
    parameter_scale: "max_coefficient"

  benchmark_ablation:
    objectives: ["mean", "cvar"]
    restarts: [1, 4]

  development_sensitivity:
    depths: [1, 2, 3]
    max_evals: [90, 180, 300]
    eval_shots: [200, 500, 1000]
    cvar_alpha: [0.05, 0.10, 0.25, 0.50, 1.0]

# ---------------------------------------------------------------------------
# Stage 4: quantum-vs-classical coarse-grained benchmark
# (batch_benchmark_hard_set.py --research-ablation). This is the ablation
# sweep: five pruning strategies x output-budget curve x QAOA objective x
# single/multi-start, all sharing one perturbed input / candidate set /
# fixed evaluation region per (pruning, radius, depth, max_evals, seed)
# case, with every solver's cost fields (solver_seconds, oracle_seconds,
# single_state_energy_queries) recorded explicitly so equal-output is never
# read as equal-budget.
# ---------------------------------------------------------------------------
qc_benchmark:
  # Relative to THIS run's own dataset_dir/checkpoint_dir (paths.dataset_dir/
  # paths.checkpoint_dir under run_dir), never a fixed repo-root path -- see
  # requirement #4. run_full_experiment.py resolves these as
  # run_dir/<paths.dataset_dir>/<input_dir> and run_dir/<paths.checkpoint_dir>/<checkpoint>.
  input_dir: "graphs/test_snac_hard"
  checkpoint: "best_egnn_pruning.pt"
  workers: 16  # runtime fallback; auto-resolved CPU workers for legal-subspace simulation
  max_targets: 0  # 0 = every qualifying graph in input_dir, no silent subset
  max_failure_fraction: 0.0  # formal benchmark is fail-closed by default
  pruning: ["egnn", "contact", "distance", "cdr", "random"]
  # Subgraph radius used to name/record each case. Coarse antigen and fixed-VHH
  # non-bonded terms use the FULL complex, limited only by
  # coarse_force_field.cutoff_angstrom, so this value no longer changes energies.
  radii: [6.0]
  # QAOA depth/evaluation budgets are read only from quantum_protocol.
  # Active-site scaling axis for the quantum-vs-classical benchmark. Every
  # scaling case uses three states/site, one from each chi1 well (12/18/24/30
  # bits); cases lacking all three wells fail instead of changing resolution.
  # Combinatorial growth is literature-grounded [R10-R12], while these exact
  # levels are preregistered study choices.
  # 6 sites remains the frozen primary confirmatory size; 4/8/10 are
  # pre-declared scaling conditions used to study size-dependent performance.
  active_sites: [4, 6, 8, 10]
  antigen_guidance_weight: 0.25  # EGNN probability / label-free nearest-antigen proximity blend
  antigen_proximity_scale_angstrom: 6.0
  contact_ca_cutoff_angstrom: 8.0
  rotamer_model:
    mode: "dunbrack2010"  # backbone-dependent Dunbrack 2010 rotamer model [R2]
    # Local path to the licensed/attributed ALL.bbdep.rotamers.lib file.
    # Formal runs fail closed if this file is missing.
    library_path: "data/rotamer/ALL.bbdep.rotamers.lib"
    probability_floor: 1.0e-4
    sigma_offsets: [-1.0, 0.0, 1.0]
  energy_calibration:
    # Coefficients are fit ONLY on training complexes against Amber14
    # all-atom energy deltas, then frozen for validation/test.
    mode: "frozen"
    calibration_file: "calibration/coarse_to_amber.json"
    training_csv: "calibration/coarse_to_amber_train.csv"
    require_calibrated: true
    ridge_alpha: 1.0
    acceptance:
      min_train_complexes: 20
      min_train_groups: 20
      min_cv_folds: 5
      max_cv_rmse_kcal: 10.0
      max_cv_mae_kcal: 7.5
      min_cv_r2: 0.20
      min_cv_spearman: 0.40
      min_rmse_improvement_kcal: 0.0
      max_generation_failure_fraction: 0.10
      require_family_grouped_cv: true
    selection_mode: "egnn"  # training complexes only, but match the formal downstream site-selection distribution
    max_complexes: 0        # 0 = every eligible training complex
    assignments_per_complex: 64
    active_sites: 6
    radius_angstrom: 6.0
    # Both files are created inside the current run directory. Validation/test
    # rows are never accepted by the fitter.
  # Coarse-grained non-bonded proxy parameters. These are model parameters,
  # not binding-affinity constants; all values are recorded in QUBO metadata.
  coarse_force_field:
    cutoff_angstrom: 8.0
    softcore_delta_angstrom: 0.5
    hard_core_fraction: 0.72
    hard_sphere_penalty: 25.0
    lj_repulsion_cap: 50.0
    lj_attraction_cap: 5.0
    coulomb_cap: 20.0
    dielectric_base: 4.0
    dielectric_slope: 2.0
    thermal_energy_kcal: 0.593
  # Side-chain search: full Dunbrack chi1..chiN states; coarse pseudo-atoms
  # remain chi1-oriented. Formal scaling and calibration retain exactly three
  # states/site, one per chi1 well; resolution sensitivity separately tests 3-6.
  outputs: [10, 30, 100, 300, 1000]  # matched-output curve; primary output_shots is frozen in quantum_protocol
  time_baselines: true
  sa_passes: 100  # SA baseline method is literature-established [R13]; pass count is a preregistered compute budget
  greedy_passes: 50
  energy_window: 2.0
  sensitivity:
    input_dir: "graphs/train"
    max_targets: 20
    active_sites: 6  # development-only hyperparameter sensitivity at the primary size
    outputs: 300
    repeats: 3
    rotamer_resolution:
      active_sites: [4, 5]
      states_per_site: [3, 4, 5, 6]
      # Same frozen training subset and repeat seeds in all eight conditions.
      # QAOA uses the primary p=2, max_evals=90, alpha=0.1 and 500 eval shots.
      # This is a representation/solver sensitivity, not a quantum-advantage test.
    note: "development/training graphs only; primary hard/validation protocol remains frozen at p=2, max_evals=90, shots=500, alpha=0.1"
  # Number of independent repeat/perturb identities per (pruning, radius,
  # depth, max_evals) case -- passed as --seeds to _ablation_main, which now
  # derives each case's independent --master-seed-based optimize/sample
  # sub-seeds itself (requirement #2; never two flat values guessed at by
  # this orchestrator and stuffed into --seeds as if they were ordinary
  # repeats).
  repeats: 10

# ---------------------------------------------------------------------------
# Stage 5: real-atom structural experiment (run_real_complex_pilot.py, run
# without --prepare-only against the already-frozen dev and validation
# queues from stage 2b). Saves perturbed/relax-only/discrete/stage1/stage2
# structures and their metrics for every case, supporting the paired
# energy-down/RMSD-up analysis in the final report.
# ---------------------------------------------------------------------------
structure_experiment:
  # Shared side-chain perturbation repeat identities, passed through to
  # run_real_complex_pilot.py as --seeds. run_real_complex_pilot.py itself
  # now derives each selected target's independent --optimize-seeds/
  # --sample-seeds from streams["optimize"]/streams["sample"] keyed by
  # (target pdb, each seed here) -- see requirement #2 -- so these values
  # are never reused directly as the QAOA search or final-sampling seed.
  seeds: [42, 43, 44, 45, 46]
  relax_iterations: 200
  candidate_relax_iterations: 100
  antigen_guidance_weight: 0.25
  antigen_proximity_scale_angstrom: 6.0
  contact_ca_cutoff_angstrom: 8.0
  rotamer_model:
    mode: "dunbrack2010"
    library_path: "data/rotamer/ALL.bbdep.rotamers.lib"
    probability_floor: 1.0e-4
    sigma_offsets: [-1.0, 0.0, 1.0]
  # Formal all-atom search uses complete Dunbrack chi1..chiN states and
  # multi-chi perturbation/recovery; 3-6 states/site -> <=30 variables.
  loop_relax_iterations: 100
  robust_qaoa: true
  # QAOA depth, budgets, objective, restarts, shots and parameter scaling are
  # inherited verbatim from quantum_protocol.primary.
  perturbation_mode: "multi_chi"
  solvent_model: "vacuum"  # frozen primary structural protocol
  solvent_sensitivity: ["vacuum", "gbn2"]  # development queue only
  min_perturb_degrees: 40.0
  max_perturb_degrees: 120.0

# ---------------------------------------------------------------------------
# External validation / mature structural baselines.
# These are real external dependencies; formal runs fail closed when required
# inputs are absent. External VHH graphs must have been built with graph v1.8
# and independently certified against the training family/structure cluster map.
# ---------------------------------------------------------------------------
external_validation:
  required: true
  external_vhh:
    required: true
    graph_dir: "data/external_vhh/graphs"
    source_structure_dir: "data/external_vhh/structures"  # trusted raw <pdb>.pdb/.cif/.mmcif files used to verify graph residues and CA coordinates
    # The external-vs-training independence audit is regenerated by every run as
    # <run_dir>/external_validation/external_vhh_independence_manifest.json.
    max_targets: 0
    repeats: 10
    min_clusters: 10
  structural_baselines:
    required: true
    faspr_executable: "/opt/FASPR/FASPR"  # fallback only; server resolver uses QP_FASPR/server_config/PATH
    phenix_clashscore_executable: "/opt/phenix/phenix.clashscore"  # fallback only; auto-resolved at launch
    timeout_seconds: 1800

# ---------------------------------------------------------------------------
# Stage 6: paired statistics (batch_benchmark_hard_set.py --paired-statistics)
# ---------------------------------------------------------------------------
statistics:
  resamples: 10000
  primary_qc_baseline: "sa"
  primary_qc_metric: "gap"
  min_qc_clusters: 10  # adequacy gate for the frozen coarse QAOA-vs-classical primary contrast
  min_scaling_clusters: 10  # independent family/structure clusters for the fixed-p=2 scaling slope
  min_primary_clusters: 10  # adequacy gate, not a formal power guarantee
  min_rq5_clusters: 10
  budget_modes: ["outputs", "time"]
  primary_pruning: "egnn"  # confirmatory solver/scaling inference uses the main EGNN-pruned problem only
  primary_radius: 6.0
  # QAOA primary depth/evaluation/output/objective/restart settings are read
  # exclusively from quantum_protocol.primary.
  primary_active_sites: 6  # preregistered confirmatory size; not a literature-defined optimum
  primary_structural_endpoint: "final_rmsd"
  primary_structural_contrast: "qaoa_vs_sa"
  max_time_overrun_fraction: 0.10
  # Statistics always reuse the exact run-local family/structure cluster map
  # frozen by queue_freeze. A separate statistics.cluster_map override is
  # intentionally forbidden to prevent split/statistics cluster drift.

# ---------------------------------------------------------------------------
# Stage 7: final report (generate_final_research_report.py)
# ---------------------------------------------------------------------------
final_report:
  filename: "FINAL_RESEARCH_REPORT.md"

# ---------------------------------------------------------------------------
# Hardware resource limits; worker counts live in their owning stages.
# Training uses DDP; ablations use spawned CPU worker processes.
# Structural target execution remains sequential; platform is explicit.
# ---------------------------------------------------------------------------
hardware:
  cpu_threads_per_process: 2
  openmm_cpu_threads: 8
  # Runtime fallbacks only. resolve_server_config.py selects CPU/GPU resources
  # for the current server; scientific energy-decomposition tolerances remain unchanged.
  openmm_platform: "CUDA"
  openmm_device: "0"
  openmm_precision: "double"
# ---------------------------------------------------------------------------
# Resume / duplicate-launch protection
# ---------------------------------------------------------------------------
control:
  lock_file_name: ".run_full_experiment.lock"
  stage_timeout_seconds: 0  # 0 = no per-stage timeout

# ---------------------------------------------------------------------------
# DEPLOYMENT OVERRIDE (applied by build_bundle.py when packaging this
# server bundle, 2026-09-19 02:44:13Z):
#   data_root -> /data/quantum-protein/data (server's existing raw data; not bundled)
#   run_root  -> /data/quantum-protein/runs (shared, outside this versioned code dir;
#                survives future code re-deploys)
#   stages.smoke_check -> false was part of that packaged bundle only; this
#                source configuration keeps stages.smoke_check: true (see the
#                stages block above), which is the value a run launched from
#                this file actually freezes into <run_dir>/frozen_config.yaml.
# This revised configuration must not be mixed into an existing frozen run.
# ---------------------------------------------------------------------------
