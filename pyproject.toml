[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nanoqc"
version = "0.1.0"
description = "Quantum-classical VHH-antigen interface side-chain reconstruction benchmark"
readme = "README.md"
requires-python = ">=3.10"
# Runtime dependencies are listed (unpinned) in requirements.txt; the formal
# server environment is the source of truth and is archived per run as
# provenance/pip_freeze.txt. They are deliberately not duplicated here.

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# PyG 2.8 scripts SelectOutput during import; torch 2.14 warns that this
# third-party TorchScript call is deprecated (pyg-team/pytorch_geometric#10697).
# Keep the filter specific so warnings from our code remain visible.
filterwarnings = [
    "ignore:^`torch\\.jit\\.script` is deprecated\\. Please switch to `torch\\.compile` or `torch\\.export`\\.$:FutureWarning:torch\\.jit\\._script",
]
